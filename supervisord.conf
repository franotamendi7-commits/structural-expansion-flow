[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
loglevel=info

[program:bot]
command=python3 run_bots_background.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/bot_stdout.log
stderr_logfile=/tmp/bot_stderr.log
startsecs=5

[program:dashboard]
command=streamlit run app.py --server.port=%(ENV_PORT)s --server.address=0.0.0.0 --server.headless=true --browser.gatherUsageStats=false --theme.base=dark --server.enableCORS=false --server.enableXsrfProtection=false
directory=/app
autostart=true
autorestart=true
stdout_logfile=/tmp/dashboard_stdout.log
stderr_logfile=/tmp/dashboard_stderr.log
startsecs=3
